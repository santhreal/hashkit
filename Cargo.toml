[workspace]
members = ["."]

[package]
name = "hashkit"
version = "0.1.4"
edition = "2021"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
rust-version = "1.85"
license = "MIT"
description = "Fast hash function collection for Rust. FNV-1a, WyHash, SplitMix, BLAKE3, SHA-256, plus Shannon entropy"
repository = "https://github.com/santhreal/hashkit"
homepage = "https://santh.dev"
readme = "README.md"
keywords = [ "hash", "blake3", "fnv", "splitmix", "wyhash" ]
categories = ["algorithms", "no-std"]

[package.metadata.santh]
status = "beta"

[lib]
path = "src/lib.rs"

[[bench]]
name = "hash_bench"
harness = false

# Per-crate lint table: cannot merge `workspace = true` with local overrides (Cargo).
# Align with workspace defaults except relax items needed by integration tests / benches;
# `src/lib.rs` re-applies strict `expect` / `unwrap` / `pedantic` for the library.

[dev-dependencies]
proptest = "1.5"

[dependencies]
base64 = "0.22"
blake3 = "1.8.4"
constant_time_eq = "0.3"
sha2 = "0.10"

[[test]]
name = "unit_audit_additional"
path = "tests/unit/audit_additional.rs"

[[test]]
name = "unit_audit_content_addressing"
path = "tests/unit/audit_content_addressing.rs"

[[test]]
name = "unit_concurrent"
path = "tests/unit/concurrent.rs"

[[test]]
name = "unit_extreme_scale"
path = "tests/unit/extreme_scale.rs"

# NOTE: the aggregator targets below (adversarial_adversarial, integration_integration,
# property_property) #[path]-include their sibling files as modules, so those siblings
# must NOT also have standalone [[test]] targets or they compile+run twice. Siblings
# that are NOT aggregated (break_it*, entropy, campaign_*) keep their own targets.
[[test]]
name = "adversarial_adversarial"
path = "tests/adversarial/adversarial.rs" # includes exhaust.rs + kats.rs

[[test]]
name = "adversarial_break_it"
path = "tests/adversarial/break_it.rs"

[[test]]
name = "adversarial_break_it_blake3"
path = "tests/adversarial/break_it_blake3.rs"

[[test]]
name = "integration_integration"
path = "tests/integration/integration.rs" # includes bloom.rs

[[test]]
name = "property_property"
path = "tests/property/property.rs" # includes blake3.rs + invariants.rs + large_fuzz.rs

[[test]]
name = "campaign_s_proptest_03"
path = "tests/campaign_s_proptest_03.rs"

[[test]]
name = "property_entropy"
path = "tests/property/entropy.rs"

